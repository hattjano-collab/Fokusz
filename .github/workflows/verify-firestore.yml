name: Check Firestore Security Rules
on:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-rules-smoke.mjs'
      - '.github/workflows/verify-firestore.yml'
  workflow_dispatch:
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@14
      - name: Install Firestore rule test SDKs
        run: npm install --no-save firebase@12 @firebase/rules-unit-testing@5
      - name: Validate QR-team authorization and atomic wallet rules
        run: firebase emulators:exec --project demo-fokusz --only firestore "node tests/firestore-rules-smoke.mjs"
