name: Fókusz Edző Weboldal
on:
  push:
    branches: [ main ]
    paths:
      - 'web/edzes/**'
      - '.github/workflows/edzes-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Downloadable standalone workout page
        uses: actions/upload-artifact@v4
        with:
          name: Fokusz-Edzes-Weboldal
          path: web/edzes/index.html
          retention-days: 90
      - name: Check if repository owner enabled GitHub Pages
        id: site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "GitHub Pages must be enabled manually under Settings -> Pages -> Source: GitHub Actions"; fi
      - name: Configure GitHub Pages
        if: steps.site.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        if: steps.site.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/edzes
      - name: Publish website
        if: steps.site.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
