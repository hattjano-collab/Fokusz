name: Fókusz Edző Weboldal
on:
  push:
    branches: [ main ]
    paths:
      - 'web/edzes/**'
      - '.github/workflows/edzes-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Downloadable standalone workout page
        uses: actions/upload-artifact@v4
        with:
          name: Fokusz-Edzes-Weboldal
          path: web/edzes/index.html
          retention-days: 90
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/edzes
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
